global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/dms-recording-rules.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8082']

  - job_name: documents
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['documents:8081']

  - job_name: comments
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['comments:8083']
