groups:
  - name: dms_slo_cost_intelligence
    interval: 30s
    rules:
      - record: dms:gateway:request_rate_5m
        expr: sum(rate(http_server_requests_seconds_count{job="gateway"}[5m]))

      - record: dms:gateway:error_rate_5m
        expr: sum(rate(http_server_requests_seconds_count{job="gateway",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="gateway"}[5m])), 1)

      - record: dms:gateway:availability_5m
        expr: 1 - dms:gateway:error_rate_5m

      - record: dms:gateway:latency_p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="gateway"}[5m])))

      - record: dms:gateway:latency_p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{job="gateway"}[5m])))

      - record: dms:kafka:consumer_lag
        expr: sum(kafka_consumergroup_lag) or vector(0)

      - record: dms:infra:monthly_storage_gb
        expr: ((sum(container_fs_usage_bytes{container!=""}) / 1024 / 1024 / 1024) * 730 / 24) or vector(0)

      - record: dms:cost:monthly_storage_estimate_usd
        expr: dms:infra:monthly_storage_gb * 0.023
