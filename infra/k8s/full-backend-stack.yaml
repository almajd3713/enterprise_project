apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator-service
  template:
    metadata:
      labels:
        app: translator-service
    spec:
      containers:
        - name: translator-service
          image: docker-translator-service:minikube
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_INPUT_TOPIC
              value: dms.documents.uploaded
            - name: KAFKA_OUTPUT_TOPIC
              value: dms.documents.translated
            - name: TRANSLATION_PROVIDERS
              value: libretranslate,google,gemini,mock
            - name: LIBRETRANSLATE_URL
              value: http://libretranslate:5000
---
