apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comments-service
  template:
    metadata:
      labels:
        app: comments-service
    spec:
      containers:
        - name: comments-service
          image: ttl.sh/enterprise-reel-comments-20260406113259:2h
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: DOCUMENTS_SERVICE_URL
              value: http://documents-service:8081
            - name: JWT_SECRET
              value: change-this-for-production-and-use-a-strong-key-please-1234567890
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: comments-service
spec:
  type: ClusterIP
  selector:
    app: comments-service
  ports:
    - port: 8083
      targetPort: 8083
