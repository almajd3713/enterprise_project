apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: observability
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'DMS Dashboards'
        orgId: 1
        folder: 'DMS'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: DS_PROMETHEUS
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  dms-metrics-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "targets": [
            {"expr": "sum by (job) (rate(http_server_requests_seconds_count{job=~\"gateway|auth-service|documents|comments|audit-service|search-service\"}[5m])) or vector(0)", "legendFormat": "{{job}}", "refId": "A"}
          ]
        },
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "title": "Latency by Service",
          "type": "timeseries",
          "targets": [
            {"expr": "(sum by (job) (rate(http_server_requests_seconds_sum{job=~\"gateway|auth-service|documents|comments|audit-service|search-service\"}[5m])) / clamp_min(sum by (job) (rate(http_server_requests_seconds_count{job=~\"gateway|auth-service|documents|comments|audit-service|search-service\"}[5m])), 1)) or vector(0)", "legendFormat": "{{job}}", "refId": "A"}
          ]
        },
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "title": "5xx Error Rate by Service",
          "type": "timeseries",
          "targets": [
            {"expr": "(((sum by (job) (rate(http_server_requests_seconds_count{job=~\"gateway|auth-service|documents|comments|audit-service|search-service\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum by (job) (rate(http_server_requests_seconds_count{job=~\"gateway|auth-service|documents|comments|audit-service|search-service\"}[5m])), 1))) or vector(0)", "legendFormat": "{{job}}", "refId": "A"}
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["dms", "enterprise"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "",
      "title": "DMS Enterprise Metrics",
      "uid": "dms-enterprise-metrics",
      "version": 1,
      "weekStart": ""
    }
  dms-slo-cost-intelligence-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "title": "Platform Throughput (5m)",
          "type": "timeseries",
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{job=~\"auth-service|documents|comments|audit-service|search-service\"}[5m]))", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "title": "Platform Avg Latency (5m)",
          "type": "timeseries",
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_sum{job=~\"auth-service|documents|comments|audit-service|search-service\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=~\"auth-service|documents|comments|audit-service|search-service\"}[5m])), 1)", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "title": "Platform Availability (5m)",
          "type": "timeseries",
          "targets": [{"expr": "1 - (sum(rate(http_server_requests_seconds_count{job=~\"auth-service|documents|comments|audit-service|search-service\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=~\"auth-service|documents|comments|audit-service|search-service\"}[5m])), 1))", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 4,
          "title": "Gateway Error Budget Burn Proxy",
          "type": "timeseries",
          "targets": [{"expr": "(sum(rate(http_server_requests_seconds_count{job=~\"auth-service|documents|comments|audit-service|search-service\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=~\"auth-service|documents|comments|audit-service|search-service\"}[5m])), 1)) / 0.001", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 5,
          "title": "Kafka Consumer Lag",
          "type": "timeseries",
          "targets": [{"expr": "sum(kafka_consumergroup_lag) or vector(0)", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "DS_PROMETHEUS"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 6,
          "title": "Estimated Monthly Storage Cost (USD)",
          "type": "timeseries",
          "targets": [{"expr": "((sum(minio_cluster_capacity_usable_total_bytes) - sum(minio_cluster_capacity_usable_free_bytes)) / 1024 / 1024 / 1024) * 0.023 or vector(0)", "refId": "A"}]
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["dms", "slo", "cost"],
      "templating": {"list": []},
      "time": {"from": "now-24h", "to": "now"},
      "timezone": "",
      "title": "DMS SLO & Cost Intelligence",
      "uid": "dms-slo-cost-intel",
      "version": 1,
      "weekStart": ""
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
      volumes:
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
