apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: auth-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['auth-service.default.svc.cluster.local:8082']

      - job_name: documents
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['documents-service.default.svc.cluster.local:8081']

      - job_name: comments
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['comments-service.default.svc.cluster.local:8083']

      - job_name: audit-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['audit-service.default.svc.cluster.local:8086']

      - job_name: search-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['search-service.default.svc.cluster.local:8087']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
