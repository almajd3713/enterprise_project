spring.datasource.url=jdbc:postgresql://postgres:5432/documentsdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
comments.service.url=${COMMENTS_SERVICE_URL:http://comments-service:8083}
app.auth.jwt-secret=${JWT_SECRET:change-this-for-production-and-use-a-strong-key-please-1234567890}
