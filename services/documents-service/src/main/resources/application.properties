spring.application.name=documents-service
server.port=8081
app.auth.jwt-secret=${JWT_SECRET:change-this-for-production-and-use-a-strong-key-please-1234567890}
# H2 Database
spring.datasource.url=jdbc:h2:mem:documentsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Redis cache configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# AWS S3 / MinIO Configuration
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.access-key=admin
aws.s3.secret-key=ensia1234
aws.s3.bucket=documents
aws.s3.region=us-east-1

# File upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Kafka producer settings
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Document event publishing
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.topics.documents-uploaded=${KAFKA_TOPIC_DOCUMENTS_UPLOADED:dms.documents.uploaded}
app.kafka.topics.documents-translated=${KAFKA_TOPIC_DOCUMENTS_TRANSLATED:dms.documents.translated}
app.kafka.translation.source-language=${KAFKA_TRANSLATION_SOURCE_LANGUAGE:en}
app.kafka.translation.target-language=${KAFKA_TRANSLATION_TARGET_LANGUAGE:fr}

# Kafka consumer (translation result sink)
app.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:dms-documents-consumer}

# MinIO public endpoint for pre-signed URL generation
aws.s3.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
aws.s3.presigned-url-expiry-minutes=${MINIO_PRESIGNED_EXPIRY_MINUTES:60}