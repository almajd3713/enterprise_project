spring.application.name=s3-hello-world
server.port=8010
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.s3.region=${S3_REGION:us-east-1}
app.s3.access-key=${S3_ACCESS_KEY:admin}
app.s3.secret-key=${S3_SECRET_KEY:ensia1234}
app.s3.bucket=${S3_BUCKET:ensia}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
app.s3.presign-duration-seconds=${S3_PRESIGN_DURATION_SECONDS:300}
# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
