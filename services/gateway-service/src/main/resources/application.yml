server:
  port: 8080

spring:
  application:
    name: gateway-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/documentsdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://auth-service:8082}
              predicates:
                - Path=/api/auth/**
            - id: users
              uri: ${AUTH_SERVICE_URL:http://auth-service:8082}
              predicates:
                - Path=/api/users/**
            - id: departments
              uri: ${AUTH_SERVICE_URL:http://auth-service:8082}
              predicates:
                - Path=/api/departments/**
            - id: documents
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/documents/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: audit
              uri: ${AUDIT_SERVICE_URL:http://audit-service:8086}
              predicates:
                - Path=/api/audit/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: search
              uri: ${SEARCH_SERVICE_URL:http://search-service:8087}
              predicates:
                - Path=/api/search/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: comments
              uri: ${COMMENTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/comments/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}

app:
  auth:
    jwt-secret: ${JWT_SECRET:change-this-for-production-and-use-a-strong-key-please-1234567890}
    token-ttl-seconds: ${JWT_TTL_SECONDS:3600}
    users:
      - username: admin
        email: admin@ensia.dz
        password: admin123
        roles:
          - ADMIN
          - USER
      - username: user
        email: user@ensia.dz
        password: user123
        roles:
          - USER
      - username: operator
        email: operator@ensia.dz
        password: operator123
        roles:
          - OPERATOR
      - username: analyst
        email: analyst@ensia.dz
        password: analyst123
        roles:
          - ANALYST
