server:
  port: 8083

spring:
  cassandra:
    keyspace-name: dms
    contact-points: ${CASSANDRA_HOST:localhost}
    port: 9042
    local-datacenter: datacenter1
    schema-action: CREATE_IF_NOT_EXISTS

app:
  auth:
    jwt-secret: ${JWT_SECRET:change-this-for-production-and-use-a-strong-key-please-1234567890}

documents:
  service:
    url: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
